<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventario de productos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="masthead">
    <div class="container">
      <p class="eyebrow">Control de existencias</p>
      <h1>Inventario de productos</h1>
    </div>
  </header>
  <main class="container" id="workspace">
    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">Registrar producto</h2>
      <form id="product-form">
        <div class="fields">
          <label>Código
            <input name="code" maxlength="20" required>
          </label>
          <label>Nombre
            <input name="name" maxlength="80" required>
          </label>
          <label>Categoría
            <input name="category" maxlength="40" required>
          </label>
          <label>Cantidad
            <input name="quantity" type="number" min="0" max="1000000" step="1" required>
          </label>
          <label>Precio (RD$)
            <input name="price" type="number" min="0" max="1000000" step="0.01" required>
          </label>
        </div>
        <div class="actions">
          <button type="submit">Guardar producto</button>
        </div>
      </form>
      <p id="notice" class="notice" role="status"></p>
    </section>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
