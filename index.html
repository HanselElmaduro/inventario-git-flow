<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventario de productos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="masthead">
    <div class="container">
      <p class="eyebrow">Control de existencias</p>
      <h1>Inventario de productos</h1>
    </div>
  </header>
  <main class="container" id="workspace">
    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">Registrar producto</h2>
      <form id="product-form">
        <div class="fields">
          <label>Código
            <input name="code" maxlength="20" required>
          </label>
          <label>Nombre
            <input name="name" maxlength="80" required>
          </label>
          <label>Categoría
            <input name="category" maxlength="40" required>
          </label>
          <label>Cantidad
            <input name="quantity" type="number" min="0" max="1000000" step="1" required>
          </label>
          <label>Precio (RD$)
            <input name="price" type="number" min="0" max="1000000" step="0.01" required>
          </label>
        </div>
        <div class="actions">
          <button type="submit" id="save-product">Guardar producto</button>
          <button type="button" id="cancel-edit" class="secondary" hidden>Cancelar edición</button>
        </div>
      </form>
      <p id="notice" class="notice" role="status"></p>
    </section>
    <section class="panel" aria-labelledby="inventory-title">
      <h2 id="inventory-title">Productos</h2>
      <div class="table-wrap" tabindex="0" role="region" aria-label="Tabla de inventario">
        <table aria-labelledby="inventory-title">
          <thead>
            <tr>
              <th scope="col">Código</th>
              <th scope="col">Nombre</th>
              <th scope="col">Categoría</th>
              <th scope="col">Cantidad</th>
              <th scope="col">Precio</th>
              <th scope="col">Acciones</th>
            </tr>
          </thead>
          <tbody id="products"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
